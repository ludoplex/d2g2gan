# Generated by ci-kit/repo_ci_init.py (script-protocol) - CI-PROTOCOL baseline.
# Re-run repo_ci_init.py to refresh; edit freely afterwards but keep the checked properties
# (permissions, pinned actions, push+pull_request triggers, concurrency, timeouts, dependabot).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-standard:
    name: CI-PROTOCOL self-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository meets the CI/CD baseline
        run: python3 .github/ci-kit/repo_ci_check.py .

  native:
    name: gcc + OpenBLAS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev
      - name: build
        run: make native
      - name: smoke (300 steps, asserts on)
        run: make test STEPS=300

  cosmo:
    name: cosmocc + CLAPACK (APE)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cache cosmocc + CLAPACK archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cosmocc
            third_party/CLAPACK-3.2.1
          key: cosmocc-clapack-3.2.1-${{ hashFiles('Makefile') }}
      - name: cosmocc toolchain
        run: |
          if [ ! -x cosmocc/bin/cosmocc ]; then
            mkdir -p cosmocc && cd cosmocc && curl -fsSL -o cosmocc.zip https://cosmo.zip/pub/cosmocc/cosmocc.zip && unzip -q cosmocc.zip && rm cosmocc.zip
          fi
          chmod +x cosmocc/bin/*
          sudo cp cosmocc/bin/ape-x86_64.elf /usr/bin/ape && sudo chmod +x /usr/bin/ape
          echo ':APE:M::MZqFpD::/usr/bin/ape:' | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null || true
      - name: CLAPACK 3.2.1 under cosmocc
        run: make clapack COSMOCC=$PWD/cosmocc/bin/cosmocc
      - name: build APE
        run: make cosmo COSMOCC=$PWD/cosmocc/bin/cosmocc
      - name: smoke (300 steps, asserts on)
        run: make test STEPS=300
      - name: it is one file that runs anywhere
        run: file build/d2g2gan.com && ls -la build/d2g2gan.com
